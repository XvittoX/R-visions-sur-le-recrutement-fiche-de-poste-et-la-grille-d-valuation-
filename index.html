<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches de révisions – Fiche de poste et grille d’évaluation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5fb;--card:#fff;--ink:#1e1b4b;--mut:#55587a;--pri:#4338ca;--acc:#0f766e;--exbg:#e6f4f1;--line:#d9dbee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12122a;--card:#1c1c3a;--ink:#eceefc;--mut:#a9acd0;--pri:#a5b4fc;--acc:#5eead4;--exbg:#12332f;--line:#33355e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12122a;--card:#1c1c3a;--ink:#eceefc;--mut:#a9acd0;--pri:#a5b4fc;--acc:#5eead4;--exbg:#12332f;--line:#33355e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:#312e81;color:#fff;text-align:center;padding:14px 16px;font-weight:700;font-size:clamp(15px,3.2vw,20px);letter-spacing:.2px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px 4px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.tabs button[aria-selected="true"]{color:#12122a}}
main{max-width:920px;margin:0 auto;padding:10px 14px 24px}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:8px 2px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.slide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,32px);margin-top:12px;min-height:420px}
.slide h2{margin:0 0 4px;font-size:clamp(20px,4.6vw,28px);color:var(--pri)}
.slide .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.slide ul{margin:0;padding-left:20px}.slide li{margin:8px 0}
.slide b{color:var(--pri)}
.ex{margin-top:16px;background:var(--exbg);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;font-size:15px}
.ex strong{color:var(--acc)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}.dots button.on{background:var(--pri)}
</style>
</head>
<body>
<div class="top">Les fiches de révisions – Recrutement : fiche de poste et grille d’évaluation</div>
<div class="tabs" role="tablist" id="tabs"></div>
<main>
 <div class="meta"><span id="deckname"></span><span id="count"></span></div>
 <div class="bar"><i id="prog"></i></div>
 <section class="slide" id="slide" aria-live="polite"></section>
 <div class="nav"><button id="prev">← Précédent</button><button id="next">Suivant →</button></div>
 <div class="dots" id="dots"></div>
</main>
<script>
const D=[
{n:"Fiche de poste",s:[
{t:"1. Définition, utilité et distinctions",u:["<b>Fiche de poste</b> : document qui décrit un poste précis dans une organisation donnée (finalité, activités, responsabilités, conditions d’exercice, compétences requises).","<b>Fiche métier / référentiel</b> : description générique d’un métier, valable pour toute l’entreprise ou la branche. <b>Profil de candidat</b> : qualités recherchées chez la personne. <b>Offre d’emploi</b> : version publique et attractive, diffusée aux candidats.","<b>Utilités</b> : cadrer le recrutement, rédiger l’annonce, construire la grille d’évaluation, préparer l’onboarding, fonder l’évaluation annuelle, positionner la rémunération, alimenter la GPEC et le plan de formation.","<b>Statut légal</b> : elle n’est pas obligatoire, mais elle sert de preuve et de référence en cas de litige (périmètre des missions, qualification, classification)."],e:"Fiche métier = « comptable ». Fiche de poste = « comptable fournisseurs, rattaché au responsable comptable du site de Lyon, 1 200 factures par mois, logiciel SAP »."},
{t:"2. Les rubriques d’une fiche de poste",u:["<b>Identification</b> : intitulé, service, lieu, type de contrat, date de création ou de mise à jour.","<b>Rattachement</b> : hiérarchique (qui valide) et fonctionnel (qui coordonne).","<b>Finalité / mission principale</b> : 1 à 2 phrases, la raison d’être du poste.","<b>Activités principales</b> (5 à 8, verbes d’action) et <b>activités ponctuelles</b>.","<b>Responsabilités et autonomie</b> : budget, encadrement, délégation, niveau de décision.","<b>Relations</b> internes et externes (clients, prestataires, administrations).","<b>Conditions d’exercice</b> : horaires, déplacements, télétravail, astreintes, rémunération indicative.","<b>Moyens et outils</b>, puis <b>profil requis</b> et <b>perspectives d’évolution</b>."],e:"Finalité d’un poste d’assistant(e) RH : « Assurer la gestion administrative du personnel et contribuer au bon déroulement des recrutements, de l’embauche au départ du salarié. »"},
{t:"3. Rédiger : règles et erreurs fréquentes",u:["<b>Verbes d’action à l’infinitif</b> : rédiger, saisir, contrôler, analyser, animer. Éviter « gérer » seul, « s’occuper de », « participer à ».","<b>Décrire le poste réel</b>, pas le titulaire actuel ni le candidat idéal. Une fiche = un poste.","<b>Mesurable</b> : volumes, fréquences, périmètre, outils (ex. 40 contrats par mois).","<b>Neutre et non discriminatoire</b> (art. L1132-1 : plus de 25 critères, dont origine, sexe, âge, handicap, situation de famille, opinions). L’intitulé s’écrit en version neutre (Chargé(e) de…).","<b>Validation à trois</b> : manager, titulaire actuel (ou pair), RH. <b>Mise à jour</b> à chaque évolution (au moins 1 fois par an).","<b>Erreurs</b> : liste de tâches infinie, vocabulaire flou (« dynamique »), exigences irréalistes, fiche copiée d’une annonce, aucune mise à jour."],e:"Mauvais : « Gérer le recrutement ». Bon : « Rédiger et diffuser les annonces, présélectionner les CV selon la grille, organiser 10 à 15 entretiens par mois, assurer le suivi du candidat jusqu’à la DPAE. »"},
{t:"4. Le profil requis : savoirs, savoir-faire, savoir-être",u:["<b>Savoirs</b> (connaissances) : diplôme, droit du travail, notions de paie, RGPD.","<b>Savoir-faire</b> (compétences techniques, hard skills) : maîtriser un ATS, mener un entretien structuré, rédiger une annonce, utiliser Excel.","<b>Savoir-être</b> (comportements, soft skills) : écoute, rigueur, discrétion, sens du service, adaptabilité.","<b>Niveau attendu</b> : échelle de maîtrise (1 notions, 2 pratique encadrée, 3 autonome, 4 expert/transmet).","<b>Éliminatoire</b> (indispensable, non négociable : ex. diplôme réglementé, habilitation, permis) / <b>important</b> / <b>souhaitable</b> (se forme en interne).","<b>Piège du « mouton à cinq pattes »</b> : trop d’exigences rend le poste infinançable et allonge le time to fill. Raisonner en compétences plutôt qu’en diplôme seul."],e:"Chargé(e) de recrutement : éliminatoire = connaissance du cadre légal du recrutement ; important = maîtrise d’un ATS ; souhaitable = expérience en cabinet."},
{t:"5. Fiche de poste complète : exemple type",u:["<b>Intitulé</b> : Chargé(e) de recrutement, CDI, Paris, rattaché(e) à la DRH. <b>Rémunération indicative</b> : 34 à 38 k€ brut annuel.","<b>Finalité</b> : conduire les recrutements de l’entreprise (environ 60 embauches par an) en garantissant qualité, délai et conformité légale.","<b>Activités principales</b> : (1) cadrer le besoin avec le manager et rédiger la fiche de poste ; (2) rédiger et diffuser les annonces ; (3) trier les CV et mener les entretiens ; (4) organiser les tests et la décision finale ; (5) préparer l’offre et la DPAE ; (6) suivre les indicateurs (time to hire, coût par embauche) ; (7) développer le sourcing et la marque employeur.","<b>Relations</b> : managers, candidats, écoles, cabinets, France Travail, service paie.","<b>Profil</b> : bac+3 RH ou équivalent ; ATS, entretien structuré, droit du travail de base ; écoute, rigueur, discrétion."],e:"Avec cette fiche, on déduit directement la grille d’évaluation : chaque activité clé devient un critère (voir fiche suivante)."}]},

{n:"Grille d’évaluation",s:[
{t:"1. Définition et enjeux",u:["<b>Grille d’évaluation</b> : outil qui liste les critères issus de la fiche de poste, leur pondération, l’échelle de notation et les comportements observables attendus pour chaque niveau.","<b>Objectivité</b> : tous les candidats sont évalués sur les mêmes critères.","<b>Comparabilité</b> : un score par critère et un total permettent d’arbitrer.","<b>Traçabilité</b> : trace écrite en cas de contestation (discrimination alléguée) et pour le retour au candidat.","<b>Qualité de décision partagée</b> : RH et manager discutent à partir de faits, pas d’impressions.","<b>Lien</b> : fiche de poste → profil requis → critères → questions d’entretien → grille remplie → décision."],e:"Sans grille, deux recruteurs peuvent noter différemment le même candidat (effet de halo, de similarité). La grille réduit l’écart et protège l’entreprise."},
{t:"2. Construire une grille en 6 étapes",u:["<b>1. Partir de la fiche de poste</b> : activités clés, profil requis, critères éliminatoires.","<b>2. Choisir 5 à 8 critères</b> (au-delà, la grille devient illisible).","<b>3. Définir des indicateurs observables</b> pour chaque critère (ce que le candidat dit ou fait).","<b>4. Pondérer par coefficient</b> selon l’importance pour le poste (ou répartir 100 %).","<b>5. Choisir l’échelle</b> : 1 à 4 (insuffisant, partiel, conforme, supérieur), de préférence sans note centrale pour forcer un avis, avec <b>ancres comportementales</b> décrites.","<b>6. Associer les outils</b> : questions STAR, cas pratique, mise en situation, test. Noter <b>juste après</b> l’entretien, <b>individuellement</b> avant le débrief."],e:"Critère « Rigueur » : 1 = oublie des étapes de contrôle ; 2 = contrôle de façon irrégulière ; 3 = applique une méthode de contrôle ; 4 = met en place sa propre check-list et la partage."},
{t:"3. Exemple chiffré : chargé(e) de recrutement",u:["<b>Critères et coefficients</b> : maîtrise ATS (×3), conduite d’entretien structuré (×3), rigueur juridique (×2), écoute et relationnel (×2), motivation (×1). Total des coefficients = 11.","<b>Candidat A</b> : ATS 3 (9 pts), entretien 4 (12 pts), rigueur juridique 3 (6 pts), relationnel 4 (8 pts), motivation 2 (2 pts).","<b>Total</b> : 9 + 12 + 6 + 8 + 2 = <b>37 points</b> sur un maximum de 11 × 4 = 44.","<b>Taux de conformité</b> : 37 ÷ 44 × 100 = <b>84 %</b>, soit 16,8 / 20 (37 ÷ 44 × 20).","<b>Seuil de décision</b> fixé en amont (ex. 70 % minimum) et <b>critères éliminatoires</b> à part : note de 1 sur un critère éliminatoire = écarté, même avec un bon total."],e:"Méthode de calcul à citer : note pondérée = Σ (note × coefficient) ÷ Σ (note maximale × coefficient)."},
{t:"4. Biais cognitifs et fiabilité",u:["<b>Effet de halo</b> : une qualité (belle élocution) influence tous les autres critères. <b>Effet de similarité</b> : préférer ceux qui nous ressemblent.","<b>Primauté / récence</b> : on retient le début ou la fin de l’entretien. <b>Contraste</b> : on juge par rapport au candidat précédent.","<b>Confirmation</b> : chercher ce qui valide la première impression. <b>Tendance centrale, indulgence, sévérité</b> : notes trop moyennes, trop hautes ou trop basses.","<b>Remèdes</b> : grille et ancres, mêmes questions pour tous, notation par critère juste après la réponse, évaluateurs multiples qui notent seuls puis comparent, formation, CV anonymisé en première lecture.","<b>Fiabilité des outils</b> : l’entretien structuré et la mise en situation prédisent mieux la performance que l’entretien libre ; un test de personnalité doit être pertinent pour le poste et validé."],e:"Deux évaluateurs notent le candidat B à 2 et 4 sur « écoute ». Au débrief, on compare les faits observés (ce qu’il a dit ou fait), pas les impressions."},
{t:"5. Cadre légal et RGPD de la grille",u:["<b>Art. L1221-6</b> : les informations demandées au candidat doivent avoir pour seule finalité d’apprécier son aptitude à occuper l’emploi (et être de bonne foi).","<b>Art. L1221-7</b> : méthodes et techniques d’aide au recrutement pertinentes au regard de la finalité. <b>Art. L1221-8</b> : candidat informé au préalable des méthodes utilisées ; résultats confidentiels.","<b>Art. L1132-1</b> : aucune décision fondée sur un critère discriminatoire (origine, sexe, âge, grossesse, situation de famille, handicap, opinions…).","<b>RGPD</b> : notes et commentaires sont des données personnelles : finalité limitée, accès restreint, droit d’accès du candidat, durée de conservation (recommandation CNIL : 2 ans max après le dernier contact), pas de décision uniquement automatisée.","<b>Commentaires</b> : factuels et professionnels. Proscrits : « fait mère de famille », « trop âgé », « accent »."],e:"Une grille avec la case « situation familiale » ou « projet d’enfant » est illicite : elle ne mesure pas l’aptitude au poste. L’entreprise s’expose à une action pour discrimination."}]},

{n:"Cas fil rouge",s:[
{t:"1. Énoncé : l’assistant(e) RH de la PME Orléa",u:["<b>Contexte</b> : PME de 90 salariés (distribution), 18 % de turnover, un(e) assistant(e) RH quitte l’entreprise après 3 ans. La DRH recrute en CDI.","<b>Demande du manager</b> : « je veux quelqu’un de dynamique, jeune, qui s’entende avec tout le monde et qui connaisse Excel ».","<b>Contraintes</b> : 8 missions réelles (administration du personnel, DPAE, suivi des absences, préparation de la paie, appui aux recrutements, organisation des formations, tableaux de bord, accueil des nouveaux).","<b>Travail demandé</b> : (1) critiquer la demande ; (2) rédiger la fiche de poste (finalité, 5 activités, profil) ; (3) construire une grille de 5 critères pondérés ; (4) trancher entre deux candidats."],e:"Critique : « jeune » (âge) est discriminatoire ; « dynamique » est flou ; « s’entende avec tout le monde » n’est pas observable ; « Excel » est trop vague (quel niveau, quelles fonctions ?)."},
{t:"2. Corrigé : fiche de poste et grille",u:["<b>Intitulé</b> : Assistant(e) RH, CDI, rattaché(e) à la DRH. <b>Finalité</b> : assurer la gestion administrative du personnel et appuyer les recrutements et la formation.","<b>5 activités</b> : (1) établir contrats, avenants et DPAE ; (2) suivre absences et congés et préparer les variables de paie ; (3) rédiger annonces et organiser les entretiens ; (4) planifier les formations et suivre leur budget ; (5) produire un tableau de bord mensuel (absentéisme, turnover).","<b>Grille (coef.)</b> : droit du travail de base ×3 (<b>éliminatoire</b> si noté 1) ; Excel (TCD, formules RECHERCHEX/SI) ×2 ; rigueur et confidentialité ×3 (<b>éliminatoire</b> si 1) ; relationnel et service ×2 ; organisation ×2. Total des coefficients = 12, maximum 48 points.","<b>Seuil</b> : 70 % (34 points) et aucun critère éliminatoire à 1.","<b>Questions STAR</b> : « Parlez d’une situation où vous avez traité une information confidentielle » ; « Comment avez-vous géré 3 urgences en même temps ? »"],e:"Réécriture de la demande du manager : « Assistant(e) RH rigoureux(se) et discret(ète), autonome sur Excel (tableaux croisés dynamiques) et à l’aise avec les salariés comme avec les managers. »"},
{t:"3. Décision, méthode de réponse et à retenir",u:["<b>Candidat 1</b> : droit 3, Excel 4, rigueur 3, relationnel 4, organisation 3 → 9 + 8 + 9 + 8 + 6 = <b>40 points</b> (83 %).","<b>Candidat 2</b> : droit 4, Excel 4, rigueur 1, relationnel 4, organisation 4 → 12 + 8 + 3 + 8 + 8 = <b>39 points</b> (81 %), mais note de 1 sur un critère éliminatoire (rigueur et confidentialité) : <b>écarté</b>.","<b>Décision</b> : candidat 1 retenu, réponse motivée et courtoise au candidat 2, conservation des grilles 2 ans maximum (RGPD).","<b>Méthode d’examen</b> : critiquer le besoin → fiche de poste → critères et pondération → grille chiffrée → décision motivée → cadre légal.","<b>Les 5 réflexes</b> : partir du poste réel ; verbes d’action observables ; mêmes critères pour tous ; éliminatoires séparés du total ; aucun critère discriminatoire."],e:"Question piège : « La fiche de poste est-elle obligatoire ? » Non, mais elle est indispensable pour justifier les critères d’une grille et prouver l’absence de discrimination."}]}
];
let d=0,i=0;const $=id=>document.getElementById(id);
function render(){const k=D[d],s=k.s[i];
$("deckname").textContent="Fiche "+(d+1)+" : "+k.n;$("count").textContent="Slide "+(i+1)+" / "+k.s.length;
$("prog").style.width=((i+1)/k.s.length*100)+"%";
$("slide").innerHTML="<h2>"+s.t+"</h2><p class='sub'>"+k.n+" · Recrutement · Bachelor RH 3e année</p><ul>"+s.u.map(x=>"<li>"+x+"</li>").join("")+"</ul>"+(s.e?"<div class='ex'><strong>Exemple / à retenir :</strong> "+s.e+"</div>":"");
$("prev").disabled=i===0;$("next").disabled=i===k.s.length-1;
$("dots").innerHTML=k.s.map((_,j)=>"<button class='"+(j===i?"on":"")+"' aria-label='Slide "+(j+1)+"' data-j='"+j+"'></button>").join("");
document.querySelectorAll("#tabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===d));}
$("tabs").innerHTML=D.map((k,j)=>"<button role='tab' data-d='"+j+"'>"+k.n+"</button>").join("");
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){d=+b.dataset.d;i=0;render();window.scrollTo(0,0)}};
$("dots").onclick=e=>{const b=e.target.closest("button");if(b){i=+b.dataset.j;render()}};
$("prev").onclick=()=>{if(i>0){i--;render()}};$("next").onclick=()=>{if(i<D[d].s.length-1){i++;render()}};
document.onkeydown=e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()};
render();
</script>
</body>
</html>
